name: NeoProxy releases

on:
  push:
    tags: ['neoproxy-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing integrated neoproxy-v<semver> tag to publish
        required: true
        type: string
  pull_request:
    branches: [nightly]
    paths:
      - .github/workflows/release.yaml
      - scripts/release_artifacts.py
      - docs/downloads.md
      - README.md
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: neoproxy-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26.4'
  CGO_ENABLED: '1'

jobs:
  source:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Pin release source
        id: source
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if os.environ['EVENT'] == 'pull_request':
              tag = ''
              version = '0.0.0-pr.' + os.environ['RUN_NUMBER']
          else:
              tag = os.environ['REQUESTED_TAG']
              if not re.fullmatch(r'neoproxy-v\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?', tag):
                  raise SystemExit('Expected neoproxy-v<semver>, not an upstream/branch ref')
              pinned = subprocess.check_output(['git', 'rev-parse', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
              if pinned != commit:
                  raise SystemExit('Checkout does not match the requested tag')
              version = tag.removeprefix('neoproxy-v')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\ncommit={commit}\ntag={tag}\n')
          PY

  archive:
    name: archive ${{ matrix.target }}
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - target: linux-amd64-static
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            variant: static
          - target: linux-arm64-static
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            variant: static
          - target: linux-amd64-glibc
            runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            variant: glibc
          - target: linux-arm64-glibc
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            variant: glibc
          - target: windows-amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            variant: native
          - target: darwin-amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            variant: native
          - target: darwin-arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            variant: native
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install native musl compiler
        if: matrix.variant == 'static'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build, package and exercise actual SQLite binary
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python --version
          binary="$RUNNER_TEMP/neoproxy"
          [[ "$GOOS" != windows ]] || binary="${binary}.exe"
          ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${SOURCE_COMMIT} -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          tags=""
          if [[ "$VARIANT" == static ]]; then
            export CC=musl-gcc
            tags="netgo,osusergo"
            ldflags="$ldflags -linkmode external -extldflags=-static"
          elif [[ "$GOOS" == windows ]]; then
            export CC=gcc
            export CGO_LDFLAGS='-static -static-libgcc'
            gcc --version
          fi
          go build -buildvcs=false -tags="$tags" -ldflags="$ldflags" -o "$binary" ./cmd/server
          if [[ "$GOOS" == windows ]]; then
            objdump -p "$binary" | grep 'DLL Name'
          fi
          if [[ "$VARIANT" == static ]] && readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            echo 'Portable Linux binary unexpectedly needs a dynamic loader' >&2
            exit 1
          fi
          python scripts/release_artifacts.py pack --binary "$binary" --version "$RELEASE_VERSION" \
            --commit "$SOURCE_COMMIT" --os "$GOOS" --arch "$GOARCH" --variant "$VARIANT" --output dist
          archives=(dist/NeoProxy_*)
          [[ ${#archives[@]} == 1 ]]
          python scripts/release_artifacts.py smoke --archive "${archives[0]}" --scratch "$RUNNER_TEMP/sqlite-smoke"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neoproxy-${{ matrix.target }}
          path: dist/NeoProxy_*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: publish complete release
    needs: [source, archive]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: neoproxy-*
          path: dist
          merge-multiple: true
      - name: Generate one complete checksum manifest
        run: python scripts/release_artifacts.py checksums --directory dist --expected 7
      - name: Publish only after every native smoke passes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_VERSION: ${{ needs.source.outputs.version }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          NeoProxy ${RELEASE_VERSION}, built from ${SOURCE_COMMIT} with CGO-enabled SQLite.

          Download the archive for your platform and SHA256SUMS. Every archive passed
          actual startup, bootstrap, user/key creation, session login/logout, process
          restart and SQLite integrity checks on its native runner before publication.

          Linux: choose *_static.tar.gz for portable use, including NixOS. SQLite
          works; native dynamic-library plugins are unavailable in the static build.
          Unsuffixed Linux archives use glibc (amd64 Ubuntu22.04; arm64 Ubuntu24.04).
          Windows: extract the amd64.zip archive and run neoproxy.exe.
          macOS: choose the matching darwin architecture archive.

          Every archive contains DOWNLOADS.md, config.example.toml and BUILD.json.
          Complete setup/security instructions:
          https://github.com/${GH_REPO}/blob/${SOURCE_COMMIT}/docs/downloads.md

          Minimum published office client: NeoPi v18.10.3-nightly.fd5698a0772a.41001835518.1
          https://github.com/PsychedelicShayna/neopi/releases/tag/v18.10.3-nightly.fd5698a0772a.41001835518.1
          Download its standalone npi executable for your platform and verify SHA256SUMS.txt.
          No source clone, Bun or manual models.yml is needed. Windows users can name
          npi-windows-x64.exe as npi.exe; Linux users make the matching asset executable
          and name it npi on their terminal PATH. The complete guide above has commands.
          Run: npi login neoproxy --url https://YOUR-PROXY-HOST
          Answer username/hidden-password prompts, then npi models neoproxy --json.
          Start npi, choose a granted model with /model (or assign roles with /models),
          and send a short prompt. Use the actual HTTPS URL from your administrator.
          Old releases without npi login neoproxy --help / --url must be upgraded.

          No runtime configuration, credentials or pre-created user database is shipped.
          EOF
          prerelease=()
          latest=true
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            prerelease=(--prerelease)
            latest=false
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > draft-status; then
            [[ "$(cat draft-status)" == true ]] || { echo 'Refusing to replace an already published release' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft "${prerelease[@]}" \
              --title "NeoProxy ${RELEASE_VERSION}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/NeoProxy_*.tar.gz dist/NeoProxy_*.zip dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false "${prerelease[@]}" --latest="$latest" \
            --title "NeoProxy ${RELEASE_VERSION}" --notes-file release-notes.md
